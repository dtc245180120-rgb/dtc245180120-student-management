version: '3.8'

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: StrongRootPassword123!
      MYSQL_DATABASE: student_db
      MYSQL_USER: student_user
      MYSQL_PASSWORD: StrongPassword123!
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: StrongRootPassword123!
    networks:
      - backend_net
      - frontend_net

  app:
    build: ./app
    container_name: student_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: student_user
      DB_PASSWORD: StrongPassword123!
      DB_NAME: student_db
    networks:
      - backend_net
      - frontend_net

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
